services:
  - type: web
    name: tasknest-rachit
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SCHEMA
        value: tasknest
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
